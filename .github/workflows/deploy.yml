name: Build & Deploy IPTV Web Streamer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript Lint
        run: npm run lint

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Verify Docker Build
        run: docker build -t iptv-web-app:test .

      - name: Deploy to Render (Optional Deploy Hook)
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Deploy Hook..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
