services:
  - type: web
    name: iptv-web-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_TRANSCODE_SESSIONS
        value: "3"
      - key: PLAYLIST_REFRESH_INTERVAL
        value: "21600"
      - key: ALLOW_LAN_ACCESS
        value: "false"
      - key: DATABASE_PATH
        value: /app/data/iptv.db
